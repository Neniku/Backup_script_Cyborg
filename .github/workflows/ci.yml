name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "[0-9]+*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck --shell=bash --severity=warning \
            Backup_Cyborg.sh

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on all scripts
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "Syntax error: $f"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $fail

      - name: Check scripts are executable
        run: |
          while IFS= read -r -d '' f; do
            [ -x "$f" ] || echo "Not executable: $f"
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

  smoke-test:
    name: Smoke test (--help)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zip openssh-client smbclient mailutils

      - name: Make executable
        run: chmod +x Backup_Cyborg.sh

      - name: --help
        run: ./Backup_Cyborg.sh --help

      - name: Startup without crash
        run: timeout 5 ./Backup_Cyborg.sh --cli 2>&1 | head -20 || true

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — gitleaks scans all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, syntax, smoke-test, secrets-scan]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this tag
        id: notes
        run: |
          python3 -c '
          import os, re
          tag = os.environ.get("TAG", "")
          clean_tag = tag.lstrip("v")
          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"## \[(?:v)?{re.escape(clean_tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          if not notes:
              notes = f"Release {tag} — Refactoring e miglioramenti"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("notes<<EOF\n" + notes + "\nEOF\n")
          '
        env:
          TAG: ${{ github.ref_name }}

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          chmod +x Backup_Cyborg.sh
          tar -czf "cyborg-backup-${TAG}.tar.gz" Backup_Cyborg.sh README.md LICENSE CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cyborg Backup ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          files: |
            cyborg-backup-${{ github.ref_name }}.tar.gz
            Backup_Cyborg.sh
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
