name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck --shell=bash --severity=warning \
            Backup_Cyborg.sh

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on all scripts
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "Syntax error: $f"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $fail

      - name: Check scripts are executable
        run: |
          while IFS= read -r -d '' f; do
            [ -x "$f" ] || echo "Not executable: $f"
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

  smoke-test:
    name: Smoke test (--help)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zip openssh-client smbclient mailutils

      - name: Make executable
        run: chmod +x Backup_Cyborg.sh

      - name: --help
        run: ./Backup_Cyborg.sh --help

      - name: Startup without crash
        run: timeout 5 ./Backup_Cyborg.sh --cli 2>&1 | head -20 || true

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — gitleaks scans all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, syntax, smoke-test, secrets-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this tag
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -f CHANGELOG.md ]; then
            notes=$(awk "/^## \[$TAG\]/,/^## \[/" CHANGELOG.md | head -n -1 | tail -n +2)
          else
            notes="See commit history."
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes"   >> "$GITHUB_OUTPUT"
          echo "EOF"      >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          chmod +x Backup_Cyborg.sh
          tar -czf "cyborg-backup-${TAG}.tar.gz" Backup_Cyborg.sh README.md LICENSE CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cyborg Backup ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          files: |
            cyborg-backup-${{ github.ref_name }}.tar.gz
            Backup_Cyborg.sh
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
