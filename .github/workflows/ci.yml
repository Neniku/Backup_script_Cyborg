name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "[0-9]+*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck --shell=bash --severity=warning \
            Backup_Cyborg.sh requirements.sh

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on all scripts
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "Syntax error: $f"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $fail

      - name: Check scripts are executable
        run: |
          while IFS= read -r -d '' f; do
            [ -x "$f" ] || echo "Not executable: $f"
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

  smoke-test:
    name: Smoke & Functional Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies via requirements.sh
        run: |
          chmod +x requirements.sh Backup_Cyborg.sh
          sudo ./requirements.sh
          ./requirements.sh

      - name: CLI flags (--help, --version, --cleanup-locks)
        run: |
          ./Backup_Cyborg.sh --help
          ./Backup_Cyborg.sh --version
          ./Backup_Cyborg.sh --cleanup-locks

      - name: Functional test (AES-256 zip, diario-backup.log manifest, SHA-256, cleanup)
        run: |
          bash -c '
            source <(sed "s/^main \"\$@\"/# main/" Backup_Cyborg.sh)
            TEMP_DIR=$(mktemp -d)
            SOURCE_DIR=$(mktemp -d)
            LOG_DIR=$(mktemp -d)
            LOG_FILE="$TEMP_DIR/diario-backup.log"
            BACKUP_NAME="ci_backup"
            FILE_TIMESTAMP="2026_ci"
            LOG_PASSWORD="TestLogPassword123!"
            dd if=/dev/urandom of="$SOURCE_DIR/sample.bin" bs=1M count=1 status=none
            echo "cyborg test" > "$SOURCE_DIR/documento.txt"
            check_requirements
            core_create_encrypted_backup
            [ "${#ENCRYPTION_PASSWORD}" -eq 24 ] || exit 1
            [ "$HASH_COUNT" -ge 1 ] || exit 1
            grep -q "documento.txt" "$LOG_FILE" || exit 1
            generate_enhanced_html_report
            finalize_local_logs
            cleanup_local_archives
            rm -rf "$TEMP_DIR" "$SOURCE_DIR" "$LOG_DIR"
          '

      - name: Startup without crash
        run: timeout 5 ./Backup_Cyborg.sh --cli 2>&1 | head -20 || true

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — gitleaks scans all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, syntax, smoke-test, secrets-scan]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this tag
        id: notes
        run: |
          python3 -c '
          import os, re
          tag = os.environ.get("TAG", "")
          clean_tag = tag.lstrip("v")
          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"## \[(?:v)?{re.escape(clean_tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          if not notes:
              notes = f"Release {tag} — Refactoring e miglioramenti"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("notes<<EOF\n" + notes + "\nEOF\n")
          '
        env:
          TAG: ${{ github.ref_name }}

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          chmod +x Backup_Cyborg.sh requirements.sh
          tar -czf "cyborg-backup-${TAG}.tar.gz" Backup_Cyborg.sh requirements.sh README.md LICENSE CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cyborg Backup ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          files: |
            cyborg-backup-${{ github.ref_name }}.tar.gz
            Backup_Cyborg.sh
            requirements.sh
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
